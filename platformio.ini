[platformio]
src_dir = main

; The flashed partition table comes from board_build.partitions below (PlatformIO
; generates $BUILD_DIR/partitions.bin from it). The CONFIG_PARTITION_TABLE_*
; symbols inside sdkconfig.alphapi_esp32s2 do not select that file, so do not
; "fix" them: partitions.csv is the single source of truth for the layout.

[env:alphapi_esp32s2]
; ESP-IDF 6.1 via the latest platform release. The espidf framework on ESP32-S2
; uses the unified toolchain-xtensa-esp-elf (GCC 15.2).
platform = espressif32@7.1.3
board = esp32-s2-saola-1
framework = espidf
board_build.flash_size = 8MB
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
monitor_speed = 115200
; LittleFS is an external ESP-IDF component (it is not part of the core). The
; capture partition uses it instead of SPIFFS: 63-character file names instead of
; 31, power-loss safe, and no garbage-collector slowdown when the partition fills
; up. The partition subtype in partitions.csv must match ("littlefs").
;
; It is vendored as the git submodule components/esp_littlefs (pinned to
; v1.23.0) instead of being listed in lib_deps: the ESP-IDF builder shipped with
; platform-espressif32 7.1.3 puts only the project sources and the Arduino
; framework into EXTRA_COMPONENT_DIRS, so a lib_deps package is downloaded but
; never registered as a component and CMake fails with "Failed to resolve
; component 'esp_littlefs'". Anything under components/ is discovered by ESP-IDF
; itself and needs no help from the platform builder.
;
; Clone with submodules, or run `git submodule update --init --recursive` before
; building: the component itself carries the littlefs submodule.
