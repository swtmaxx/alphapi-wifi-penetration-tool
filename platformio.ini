[platformio]
src_dir = main

; The flashed partition table comes from board_build.partitions below (PlatformIO
; generates $BUILD_DIR/partitions.bin from it). The CONFIG_PARTITION_TABLE_*
; symbols inside sdkconfig.alphapi_esp32s2 do not select that file, so do not
; "fix" them: partitions.csv is the single source of truth for the layout.
[env:alphapi_esp32s2]
platform = espressif32@6.3.2
board = esp32-s2-saola-1
framework = espidf
board_build.flash_size = 8MB
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
monitor_speed = 115200

