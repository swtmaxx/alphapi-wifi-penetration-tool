name: Build ESP32-S2 Firmware

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

# The build only reads the repository; keep the default token read-only.
permissions:
  contents: read

jobs:
  build:
    name: Build alphapi_esp32s2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache PlatformIO
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio==6.2.0

      - name: Build firmware
        run: pio run -e alphapi_esp32s2

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alphapi_esp32s2-firmware
          path: |
            .pio/build/alphapi_esp32s2/firmware.bin
            .pio/build/alphapi_esp32s2/bootloader.bin
            .pio/build/alphapi_esp32s2/partitions.bin
          if-no-files-found: error
