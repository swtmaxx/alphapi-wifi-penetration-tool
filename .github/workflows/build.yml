name: Build ESP32-S2 Firmware

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    name: Build alphapi_esp32s2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: pio run -e alphapi_esp32s2

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alphapi_esp32s2-firmware
          path: |
            .pio/build/alphapi_esp32s2/firmware.bin
            .pio/build/alphapi_esp32s2/bootloader.bin
            .pio/build/alphapi_esp32s2/partitions.bin
          if-no-files-found: error
