<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ESP32 管理热点</title>
    <style>
    :root {
        --bg: #0b0f17;
        --surface: #141a24;
        --surface2: #1b2331;
        --border: #263043;
        --text: #e6edf6;
        --text2: #8ea0b8;
        --accent: #3b82f6;
        --accent2: #60a5fa;
        --green: #22c55e;
        --yellow: #eab308;
        --red: #ef4444;
        --radius: 12px;
        --radius-sm: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        min-height: 100vh;
        padding: 20px 16px 40px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
        font-size: 15px;
        line-height: 1.5;
    }
    .wrap { max-width: 860px; margin: 0 auto; }
    h1 {
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 20px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--border);
    }
    h2 {
        font-size: 16px;
        font-weight: 600;
        color: var(--text);
        margin: 22px 0 10px;
    }
    section { margin-bottom: 16px; }
    fieldset {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        margin-bottom: 16px;
    }
    legend {
        padding: 0 8px;
        font-size: 13px;
        font-weight: 600;
        color: var(--accent2);
    }
    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
    }
    th, td {
        padding: 10px 12px;
        text-align: left;
        border-bottom: 1px solid var(--border);
    }
    th {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: .04em;
        color: var(--text2);
        font-weight: 600;
    }
    tbody tr, table tr[onclick] { cursor: pointer; transition: background .15s; }
    tbody tr:hover, table tr[onclick]:hover { background: var(--surface2); }
    tr.selected { background: rgba(59,130,246,.18) !important; }
    tr.selected td { color: var(--accent2); }
    label { display: inline-block; min-width: 96px; color: var(--text2); }
    select, input[type=number] {
        background: var(--surface2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 8px 10px;
        font-size: 14px;
        font-family: inherit;
        min-width: 180px;
    }
    select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button {
        background: var(--accent);
        color: #fff;
        border: 0;
        border-radius: var(--radius-sm);
        padding: 9px 16px;
        font-size: 14px;
        font-family: inherit;
        font-weight: 500;
        cursor: pointer;
        transition: background .15s;
    }
    button:hover { background: var(--accent2); }
    button.btn-secondary {
        background: var(--surface2);
        color: var(--text);
        border: 1px solid var(--border);
    }
    button.btn-secondary:hover { background: var(--border); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    p { margin: 8px 0; }
    a { color: var(--accent2); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 1px 5px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
    }
    pre {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 12px;
        overflow-x: auto;
        margin-top: 10px;
    }
    pre code { background: none; border: 0; padding: 0; }
    .badge {
        display: inline-block;
        padding: 2px 9px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        background: var(--surface2);
        color: var(--text2);
        border: 1px solid var(--border);
    }
    .badge.ok { background: rgba(34,197,94,.12); color: var(--green); border-color: rgba(34,197,94,.3); }
    .badge.run { background: rgba(234,179,8,.12); color: var(--yellow); border-color: rgba(234,179,8,.3); }
    .badge.err { background: rgba(239,68,68,.12); color: var(--red); border-color: rgba(239,68,68,.3); }
    .spinner {
        display: inline-block;
        width: 15px; height: 15px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin .8s linear infinite;
        vertical-align: -2px;
        margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hint { color: var(--text2); font-size: 13px; }
    .file-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .file-row:last-child { border-bottom: 0; }
    @media (max-width: 600px) {
        body { padding: 14px 10px 32px; font-size: 14px; }
        h1 { font-size: 19px; }
        th, td { padding: 8px 6px; }
        table { font-size: 13px; }
        label { min-width: 100%; margin-bottom: 4px; }
        select, input[type=number] { width: 100%; min-width: 0; }
        button { width: 100%; }
        .row > button { width: auto; flex: 1; }
    }
</style>
</head>
<body onLoad="getStatus()">
    <div class="wrap">
    <h1>ESP32 Wi-Fi 安全测试工具</h1>
    <section id="errors"></section>
    <section id="loading">正在加载，请稍候</section>
    <section id="ready" style="display: none;">
        <h2>攻击配置</h2>
        <form onSubmit="runAttack(); return false;">
            <fieldset>
                <legend>选择目标</legend>
                <table id="ap-list"></table>
                <p class="row">
                    <button type="button" onClick="refreshAps()">刷新网络</button>
                    <button type="button" class="btn-secondary" onClick="countClients()">探测客户端</button>
                </p>
                <p class="hint">探测会短暂关闭热点逐信道嗅探，完成后需要重新连接本热点。</p>
            </fieldset>
            <fieldset>
                <legend>攻击参数</legend>
                <p>
                    <label for="attack_type">攻击类型：</label>
                    <select id="attack_type" onChange="updateConfigurableFields(this)" required>
                        <option value="0" title="此类型尚未实现" disabled>被动</option>
                        <option value="1">握手抓包</option>
                        <option value="2" selected>PMKID</option>
                        <option value="3">拒绝服务</option>
                    </select>
                </p>
                <p>
                    <label for="attack_method">攻击方式：</label>
                    <select id="attack_method" required disabled>
                        <option value="" selected disabled hidden>不适用</option>
                    </select>
                </p>
                <p>
                    <label for="attack_timeout">攻击超时（秒）：</label>
                    <input type="number" min="0" max="255" id="attack_timeout" value="" required/>
                </p>
                <p>
                    <button>开始攻击</button>
                </p>
            </fieldset>
        </form>
    </section>
    <section id="running" style="display: none;">
        已运行时间：<span id="running-progress"></span>
    </section>
    <section id="result" style="display: none;">
        <div id="result-meta">正在加载结果，请稍候</div>
        <div id="result-content"></div>
        <button type="button" onClick="resetAttack()">重新配置</button>
    </section>
    <section id="captures">
        <h2>抓包文件</h2>
        <fieldset>
            <div class="row">
                <button type="button" class="btn-secondary" onClick="loadCaptures()">刷新列表</button>
                <button type="button" onClick="downloadAllCaptures()">下载全部</button>
            </div>
            <div id="capture-list"><p class="hint">点击“刷新列表”查看已保存的抓包文件。</p></div>
        </fieldset>
    </section>
    <script>
    var AttackStateEnum = { READY: 0, RUNNING: 1, FINISHED: 2, TIMEOUT: 3};
    var AttackTypeEnum = { ATTACK_TYPE_PASSIVE: 0, ATTACK_TYPE_HANDSHAKE: 1, ATTACK_TYPE_PMKID: 2, ATTACK_TYPE_DOS: 3};
    var selectedApElement = -1;
    var poll;
    var poll_interval = 1000;
    var running_poll;
    var running_poll_interval = 1000;
    var attack_timeout = 0;
    var time_elapsed = 0;
    var defaultResultContent = document.getElementById("result").innerHTML;
    var defaultAttackMethods = document.getElementById("attack_method").outerHTML;
    function getStatus() {
        var oReq = new XMLHttpRequest();
        oReq.onload = function() {
            var arrayBuffer = oReq.response;
            if(arrayBuffer) {
                var attack_state = parseInt(new Uint8Array(arrayBuffer, 0, 1));
                var attack_type = parseInt(new Uint8Array(arrayBuffer, 1, 1));
                var attack_content_size = parseInt(new Uint16Array(arrayBuffer, 2, 1));
                var attack_content = new Uint8Array(arrayBuffer, 4);
                console.log("attack_state=" + attack_state + "; attack_type=" + attack_type + "; attack_count_size=" + attack_content_size);
                var status = "错误：无法解析攻击状态。";
                hideAllSections();
                switch(attack_state) {
                    case AttackStateEnum.READY:
                        showAttackConfig();
                        break;
                    case AttackStateEnum.RUNNING:
                        showRunning();
                        console.log("Poll");
                        setTimeout(getStatus, poll_interval);
                        break;
                    case AttackStateEnum.FINISHED:
                        showResult("已完成", attack_type, attack_content_size, attack_content);
                        break;
                    case AttackStateEnum.TIMEOUT:
                        showResult("已超时", attack_type, attack_content_size, attack_content);
                        break;
                    default:
                        document.getElementById("errors").innerHTML = "加载攻击状态失败：未知状态。";
                }
                return;
                
            }
        };
        oReq.onerror = function() {
            console.log("Request error");
            document.getElementById("errors").innerHTML = "无法连接 ESP32，请确认已连接管理热点。攻击期间可能会暂时断开。";
            getStatus();
        };
        oReq.ontimeout = function() {
            console.log("Request timeout");
            getStatus();  
        };
        oReq.open("GET", "http://192.168.4.1/status", true);
        oReq.responseType = "arraybuffer";
        oReq.send();
    }
    function hideAllSections(){
        for(let section of document.getElementsByTagName("section")){
            section.style.display = "none";
        };
    }
    function showRunning(){
        hideAllSections();
        document.getElementById("running").style.display = "block";
    }
    function countProgress(){
        if(time_elapsed >= attack_timeout){
            document.getElementById("errors").innerHTML = "请重新连接管理热点。";
            document.getElementById("errors").style.display = "block";
            clearInterval(running_poll);
        }
        document.getElementById("running-progress").innerHTML = time_elapsed + "/" + attack_timeout + "s";
        time_elapsed++;
    }
    function showAttackConfig(){
        document.getElementById("ready").style.display = "block";
        /* The capture list lives outside #ready but hideAllSections() hides
           every <section>, so it has to be re-shown explicitly. */
        document.getElementById("captures").style.display = "block";
        refreshAps();
        loadCaptures();
    }
    function showResult(status, attack_type, attack_content_size, attack_content){
        hideAllSections();
        clearInterval(poll);
        document.getElementById("result").innerHTML = defaultResultContent;
        document.getElementById("result").style.display = "block";
        document.getElementById("result-meta").innerHTML = status + "<br>";
        type = "错误：无法解析攻击类型。";
        switch(attack_type) {
            case AttackTypeEnum.ATTACK_TYPE_PASSIVE:
                type = "被动";
                break;
            case AttackTypeEnum.ATTACK_TYPE_HANDSHAKE:
                type = "握手抓包";
                resultHandshake(attack_content, attack_content_size);
                break;
            case AttackTypeEnum.ATTACK_TYPE_PMKID:
                type = "PMKID";
                resultPmkid(attack_content, attack_content_size);
                break;
            case AttackTypeEnum.ATTACK_TYPE_DOS:
                type = "拒绝服务";
                break;
            default:
                type = "未知";
        }
        document.getElementById("result-meta").innerHTML += type + "<br>";
    }
    function refreshAps() {
        document.getElementById("ap-list").innerHTML = "正在扫描，可能需要一些时间……";
        var oReq = new XMLHttpRequest();
        oReq.onload = function() {
            document.getElementById("ap-list").innerHTML = "<tr><th>网络名称</th><th>BSSID</th><th>信号</th><th>客户端</th></tr>";
            var arrayBuffer = oReq.response;
            if(arrayBuffer) {
                var byteArray = new Uint8Array(arrayBuffer);
                for  (let i = 0; i + 41 <= byteArray.byteLength; i = i + 41) {
                    var tr = document.createElement('tr');
                    tr.setAttribute("id", i / 41);
                    tr.setAttribute("onClick", "selectAp(this)");
                    var td_ssid = document.createElement('td');
                    var td_rssi = document.createElement('td');
                    var td_bssid = document.createElement('td');
                    td_ssid.innerHTML = new TextDecoder("utf-8").decode(byteArray.subarray(i + 0, i + 32));
                    tr.appendChild(td_ssid);
                    for(let j = 0; j < 6; j++){
                        td_bssid.innerHTML += uint8ToHex(byteArray[i + 33 + j]) + ":";
                    }
                    tr.appendChild(td_bssid);
                    td_rssi.innerHTML = byteArray[i + 39] - 255;
                    tr.appendChild(td_rssi);
                    var td_clients = document.createElement('td');
                    var cc = byteArray[i + 40];
                    td_clients.innerHTML = '<span class="badge' + (cc > 0 ? ' ok' : '') + '">' + cc + '</span>';
                    tr.appendChild(td_clients);
                    document.getElementById("ap-list").appendChild(tr);
                }
            }
        };
        oReq.onerror = function() {
            document.getElementById("ap-list").innerHTML = "扫描失败，请重试";
        };
        oReq.open("GET", "http://192.168.4.1/ap-list", true);
        oReq.responseType = "arraybuffer";
        oReq.send();
    }
    function selectAp(el) {
        console.log(el.id);
        if(selectedApElement != -1){
            selectedApElement.classList.remove("selected")
        }
        selectedApElement=el;
        el.classList.add("selected");
    }
    function runAttack() {
        if(selectedApElement == -1){
            console.log("No AP selected. Attack not started.");
            document.getElementById("errors").innerHTML = "尚未选择目标网络，攻击未开始。";
            return;
        }
        hideAllSections();
        document.getElementById("running").style.display = "block";
        var arrayBuffer = new ArrayBuffer(4);
        var uint8Array = new Uint8Array(arrayBuffer);
        uint8Array[0] = parseInt(selectedApElement.id);
        uint8Array[1] = parseInt(document.getElementById("attack_type").value);
        uint8Array[2] = parseInt(document.getElementById("attack_method").value);
        uint8Array[3] = parseInt(document.getElementById("attack_timeout").value);
        var oReq = new XMLHttpRequest();
        oReq.open("POST", "http://192.168.4.1/run-attack", true);
        oReq.send(arrayBuffer);
        getStatus();
        attack_timeout = parseInt(document.getElementById("attack_timeout").value);
        time_elapsed = 0;
        running_poll = setInterval(countProgress, running_poll_interval);
    }
    function resetAttack(){
        hideAllSections();
        showAttackConfig();
        var oReq = new XMLHttpRequest();
        oReq.open("HEAD", "http://192.168.4.1/reset", true);
        oReq.send();
    }
    function resultPmkid(attack_content, attack_content_size){
        var mac_ap = "";
        var mac_sta = "";
        var ssid = "";
        var ssid_text = "";
        var pmkid = "";
        var index = 0;
        for(let i = 0; i < 6; i = i + 1) {
            mac_ap += uint8ToHex(attack_content[index + i]);
        }
        index = index + 6;
        for(let i = 0; i < 6; i = i + 1) {
            mac_sta += uint8ToHex(attack_content[index + i]);
        }
        index = index + 6;
        for(let i = 0; i < attack_content[index]; i = i + 1) {
            ssid += uint8ToHex(attack_content[index + 1 + i]);
            ssid_text += String.fromCharCode(attack_content[index + 1 + i]);
        }
        index = index + attack_content[index] + 1;
        var pmkid_cnt = 0;
        for(let i = 0; i < attack_content_size - index; i = i + 1) {
            if((i % 16) == 0){
                pmkid += "<br>";
                pmkid += "</code>PMKID #" + pmkid_cnt + ": <code>";
                pmkid_cnt += 1;
            }
            pmkid += uint8ToHex(attack_content[index + i]);
        }
        document.getElementById("result-content").innerHTML = "";
        document.getElementById("result-content").innerHTML += "AP 地址：<code>" + mac_ap + "</code><br>";
        document.getElementById("result-content").innerHTML += "客户端地址：<code>" + mac_sta + "</code><br>";
        document.getElementById("result-content").innerHTML += "网络名称：<code>" + ssid + "</code> (" + ssid_text + ")";
        document.getElementById("result-content").innerHTML += "<code>" + pmkid + "</code><br>";
        document.getElementById("result-content").innerHTML += "<br>Hashcat 格式："
        document.getElementById("result-content").innerHTML += "<code>" + pmkid + "*" + mac_ap + "*" + mac_sta  + "*" + ssid  + "</code><br>";
    }
    function resultHandshake(attack_content, attack_content_size){
        document.getElementById("result-content").innerHTML = "";
        var links_div = document.createElement("div");
        var pcap_link = document.createElement("a");
        pcap_link.setAttribute("href", "capture.pcap");
        pcap_link.setAttribute("download", "capture.pcap");
        pcap_link.textContent = "下载当前 PCAP 文件";
        var hccapx_link = document.createElement("a");
        hccapx_link.setAttribute("href", "capture.hccapx");
        hccapx_link.setAttribute("download", "capture.hccapx");
        hccapx_link.textContent = "下载 HCCAPX 文件";
        links_div.appendChild(pcap_link);
        links_div.appendChild(document.createElement("br"));
        links_div.appendChild(hccapx_link);
        document.getElementById("result-content").appendChild(links_div);

        /* Refresh the file list so older captures are reachable too. */
        loadCaptures();
        var handshakes = "";
        for(let i = 0; i < attack_content_size; i = i + 1) {
            handshakes += uint8ToHex(attack_content[i]);
            if(i % 50 == 49) {
                handshakes += "\n";
            }
        }
        document.getElementById("result-content").innerHTML += "<pre><code>" + handshakes + "</code></pre>";
    }
    function countClients(){
        var btn = event && event.target ? event.target : null;
        if(btn) btn.disabled = true;
        var oReq = new XMLHttpRequest();
        oReq.onload = function(){ refreshAps(); };
        oReq.onerror = function(){
            document.getElementById("errors").innerHTML = "<p class='badge err'>客户端探测请求失败</p>";
        };
        oReq.open("POST", "http://192.168.4.1/count-clients", true);
        oReq.send();
        setTimeout(function(){ if(btn) btn.disabled = false; }, 1500);
    }
    function formatSize(bytes){
        if(bytes < 1024) return bytes + " B";
        if(bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
        return (bytes / 1048576).toFixed(2) + " MB";
    }
    function loadCaptures(){
        var box = document.getElementById("capture-list");
        box.innerHTML = "<p class='hint'><span class='spinner'></span>正在读取文件列表……</p>";
        var oReq = new XMLHttpRequest();
        oReq.onload = function(){
            var list;
            try { list = JSON.parse(oReq.responseText); } catch(e) { list = null; }
            if(!list || list.length === 0){
                box.innerHTML = "<p class='hint'>暂无抓包文件。</p>";
                return;
            }
            box.innerHTML = "";
            list.forEach(function(f){
                var row = document.createElement("div");
                row.className = "file-row";
                row.innerHTML = "<span><code>" + f.name + "</code> <span class='badge'>" + formatSize(f.size) + "</span></span>";
                var a = document.createElement("a");
                a.href = "capture-file?name=" + encodeURIComponent(f.name);
                a.innerHTML = "<button type='button' class='btn-secondary'>下载</button>";
                row.appendChild(a);
                box.appendChild(row);
            });
        };
        oReq.onerror = function(){ box.innerHTML = "<p class='badge err'>读取失败</p>"; };
        oReq.open("GET", "http://192.168.4.1/pcap-list", true);
        oReq.send();
    }
    function downloadAllCaptures(){
        var oReq = new XMLHttpRequest();
        oReq.onload = function(){
            var list;
            try { list = JSON.parse(oReq.responseText); } catch(e) { list = null; }
            if(!list || list.length === 0){
                document.getElementById("errors").innerHTML = "<p class='badge err'>没有可下载的抓包文件</p>";
                return;
            }
            list.forEach(function(f, index){
                setTimeout(function(){
                    var a = document.createElement("a");
                    a.href = "capture-file?name=" + encodeURIComponent(f.name);
                    a.download = f.name;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                }, index * 400);
            });
        };
        oReq.open("GET", "http://192.168.4.1/pcap-list", true);
        oReq.send();
    }    function uint8ToHex(uint8){
        return ("00" + uint8.toString(16)).slice(-2);
    }
    function updateConfigurableFields(el){
        document.getElementById("attack_method").outerHTML = defaultAttackMethods;
        switch(parseInt(el.value)){
            case AttackTypeEnum.ATTACK_TYPE_PASSIVE:
                console.log("PASSIVE configuration");
                break;
            case AttackTypeEnum.ATTACK_TYPE_HANDSHAKE:
                console.log("HANDSHAKE configuration");
                document.getElementById("attack_timeout").value = 60;
                setAttackMethods(["诱骗 AP（被动）", "广播去认证（主动）", "仅抓包（被动）"]);
                break;
            case AttackTypeEnum.ATTACK_TYPE_PMKID:
                console.log("PMKID configuration");
                document.getElementById("attack_timeout").value = 5;
                break;
            case AttackTypeEnum.ATTACK_TYPE_DOS:
                console.log("DOS configuration");
                document.getElementById("attack_timeout").value = 120;
                setAttackMethods(["诱骗 AP（被动）", "广播去认证（主动）", "全部组合"]);
                break;
            default:
                console.log("Unknown attack type");
                break;
        }
    }
    function setAttackMethods(attackMethodsArray){
        document.getElementById("attack_method").removeAttribute("disabled");
        attackMethodsArray.forEach(function(method, index){
            let option = document.createElement("option");
            option.value = index;
            option.text = method;
            option.selected = true;
            document.getElementById("attack_method").appendChild(option);
        });
    }
    </script>
    </div>
</body>
</html>
